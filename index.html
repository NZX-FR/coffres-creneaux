    if(i===BP_N||i===40)w={k:'item',ri:3};else if(i%20===0)w={k:'item',ri:2};else if(i%10===0)w={k:'gold',n:300+i*6};

function updPal(dt){const p=G.pal;if(!p)return;const h=G.hero;
  if(!p.init||dist(p,h)>320){p.x=h.x-24;p.y=h.y+18;p.init=1}
  const k=Math.min(1,dt*4);p.x+=(h.x-24-p.x)*k;p.y+=(h.y+18-p.y)*k;p.cd-=dt;
  if(p.cd>0)return;
  if(p===G.pal&&PALS.flameo.n===p.n){const t=nearestEnemy(p,240);if(t){p.cd=1.4;dmgEnemy(t,h.atk*.22,0,0,'feu');spark(t.x,t.y,t.ht*.5,8,'255,140,40',{glow:true,spd:90,life:.3,grav:false})}else p.cd=.3}
  else if(PALS.givrou.n===p.n){const t=nearestEnemy(p,260);if(t){p.cd=5;t.stun=Math.max(t.stun||0,isBoss(t)?.3:1);ring(t.x,t.y,t.r,t.r+30,.4,0x9ad8ff);spark(t.x,t.y,t.ht*.6,10,'170,220,255',{glow:true,spd:80,life:.5});addText(t.x,t.y,t.ht+10,'Gelé !','#bfe6ff',16)}else p.cd=.4}
  else if(PALS.piquette.n===p.n){const near=G.enemies.filter(e=>!e.dead&&dist(e,h)<100);if(near.length){p.cd=3;ring(h.x,h.y,10,100,.35,0xd8c08a);for(let i=0;i<10;i++){const a=i*.628;spark(h.x+Math.cos(a)*20,h.y+Math.sin(a)*20,20,1,'230,210,160',{spd:240,up:30,life:.35,size:4,grav:false})}near.forEach(e=>dmgEnemy(e,h.atk*.15))}else p.cd=.4}
  else if(PALS.phenix.n===p.n){const t=nearestEnemy(p,320);if(t){p.cd=1.7;fireBolt(p,t,h.atk*.32,0xff8a3a,'feu')}else p.cd=.4;p.hc=(p.hc||0)+1.7;if(p.hc>=3&&h.hp<h.maxHp){p.hc=0;const v=h.maxHp*.004;h.hp=Math.min(h.maxHp,h.hp+v);addText(h.x,h.y,h.ht+10,'+'+Math.round(v),'#ffb070',15)}}
  else if(PALS.tentacule.n===p.n){p.cd=3;if(h.hp<h.maxHp){const v=h.maxHp*.005;h.hp=Math.min(h.maxHp,h.hp+v);addText(h.x,h.y,h.ht+10,'+'+Math.round(v),'#9cf08c',16)}}
  else p.cd=1}

function buildCastle3D(){
  const T=THREE,st=STYLES.find(x=>x.k===S.style)||STYLES[0],g=new T.Group(),M=(c,o={})=>new T.MeshLambertMaterial(Object.assign({color:c},o));
  const add=(geo,mat,x,y,z)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m};
  const L=S.my.lvl,n=roomCount(),cap=capacity();
  add(new T.CylinderGeometry(4.8,4.5,.6,28),M(st.grass),0,0,0);
  const rk=add(new T.ConeGeometry(4.5,3.2,14),M(st.rock),0,-1.9,0);rk.rotation.x=Math.PI;
  // donjon central : un étage de plus par niveau
  const kh=1.5+L*.3;add(new T.BoxGeometry(1.9,kh,1.9),M(st.wall),0,.3+kh/2,0);
  for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;add(new T.BoxGeometry(.4,.35,.4),M(st.wall),Math.cos(a)*.85,.3+kh+.17,Math.sin(a)*.85)}
  add(new T.ConeGeometry(1.35,1.2,4),M(st.roof),0,.3+kh+.9,0).rotation.y=Math.PI/4;
  add(new T.CylinderGeometry(.04,.04,1,6),M('#5a4a3a'),0,.3+kh+2,0);add(new T.BoxGeometry(.6,.35,.05),M(st.deco==='gold'?'#ffcf4a':'#e2413b'),.32,.3+kh+2.3,0);
  add(new T.BoxGeometry(.6,.8,.1),M('#3a2a1e'),0,.7,.97);
  if(L>=3){const w=add(new T.CylinderGeometry(4.15,4.15,.7,32,1,true),M(st.wall,{side:T.DoubleSide}),0,.6,0)}
  if(L>=6)for(let i=0;i<16;i++){const a=i/16*Math.PI*2;add(new T.BoxGeometry(.3,.3,.3),M(st.wall),Math.cos(a)*4.15,1.1,Math.sin(a)*4.15)}
  // une tour par salle
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+.4,x=Math.cos(a)*3,z=Math.sin(a)*3,last=i===n-1,used=roomUsed(i),h=1.3+Math.min(1,used/cap)*1.8+(last?.6:0);
    add(new T.CylinderGeometry(.5,.58,h,10),M(st.wall),x,.3+h/2,z);
    add(new T.ConeGeometry(.72,.9,10),M(last?'#ffcf4a':st.roof),x,.3+h+.45,z);
    if(st.deco==='snow')add(new T.SphereGeometry(.3,8,6),M('#fff'),x,.3+h+.8,z);
    const r=S.my.rooms[i];let k=0;
    for(const m in r.mobs)for(let j=0;j<Math.min(r.mobs[m],6);j++,k++){const b=a+(k-3)*.12+.5*Math.sin(k);add(new T.SphereGeometry(.17,8,6),M(MOBCOL[m]),Math.cos(b)*3.75,.55,Math.sin(b)*3.75)}
    if(last)add(new T.BoxGeometry(.4,.3,.3),M('#ffcf4a'),x,.45,z+.75);
    if(i<n-1){let t=0;for(const m in r.traps)for(let j=0;j<r.traps[m];j++,t++){const b=a-.35-t*.2,tx=Math.cos(b)*3.9,tz=Math.sin(b)*3.9;
      if(m==='piques')add(new T.ConeGeometry(.12,.5,6),M('#c8c8d0'),tx,.55,tz);
      else if(m==='canon')add(new T.CylinderGeometry(.14,.2,.5,8),M('#2a2a32'),tx,.55,tz).rotation.z=.6;
      else if(m==='scie')add(new T.CylinderGeometry(.24,.24,.05,14),M('#d8dce4'),tx,.6,tz).rotation.x=Math.PI/2;
      else if(m==='glu')add(new T.CylinderGeometry(.28,.28,.04,12),M('#5a8a2a'),tx,.35,tz);
      else if(m==='gaz')add(new T.SphereGeometry(.2,8,6),M('#9a3ab8'),tx,.55,tz);
      else if(m==='flamme')add(new T.ConeGeometry(.16,.5,8),M('#ff5a1a',{emissive:new T.Color('#ff3a00')}),tx,.55,tz).rotation.z=Math.PI/2;
      else if(m==='ressort')add(new T.BoxGeometry(.4,.12,.4),M('#ffc23a'),tx,.45,tz);
      else add(new T.ConeGeometry(.2,.45,8),M('#ff8a1e',{emissive:new T.Color('#ff5a00')}),tx,.55,tz)}}
  }
  // décors de style
  if(st.deco==='trees')for(let i=0;i<7;i++){const a=i*.9+1,x=Math.cos(a)*4.35,z=Math.sin(a)*4.35;add(new T.CylinderGeometry(.06,.08,.4,6),M('#5a3a1e'),x,.5,z);add(new T.ConeGeometry(.3,.8,7),M('#2f8a3e'),x,1,z)}
  if(st.deco==='snow')for(let i=0;i<6;i++){const a=i*1.1+.2;add(new T.ConeGeometry(.3,.7,7),M('#dff0ff'),Math.cos(a)*4.4,.7,Math.sin(a)*4.4)}
  if(st.deco==='lava'){for(let i=0;i<8;i++){const a=i*.8;add(new T.ConeGeometry(.15,.9,5),M('#ff6a1a',{emissive:new T.Color('#ff4a00')}),Math.cos(a)*4.4,.6,Math.sin(a)*4.4)}const pl=new T.PointLight('#ff6a2a',1.2,12);pl.position.set(0,1.5,0);g.add(pl)}
  if(st.deco==='gold')for(let i=0;i<4;i++){const a=i*Math.PI/2;add(new T.CylinderGeometry(.12,.12,1.3,8),M('#ffcf4a'),Math.cos(a)*1.25,.95,Math.sin(a)*1.25)}
  return g}
const C3={r:null,sc:null,cam:null,grp:null,ang:.6,raf:0,down:false,lx:0};
function mountCastle(){

      C3.sc.add(new T.HemisphereLight('#ffffff','#6a7a9a',.85));const dl=new T.DirectionalLight('#fff3d6',.9);dl.position.set(6,10,7);C3.sc.add(dl);
      const el=C3.r.domElement;el.style.cssText='width:100%;height:100%;display:block;touch-action:pan-y';
      el.addEventListener('pointerdown',e=>{C3.down=true;C3.lx=e.clientX;try{el.setPointerCapture(e.pointerId)}catch(_){}});
      el.addEventListener('pointermove',e=>{if(C3.down){C3.ang+=(e.clientX-C3.lx)*.01;C3.lx=e.clientX}});
      const up=()=>{C3.down=false};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
    host.appendChild(C3.r.domElement);
    const w=host.clientWidth||600,h=host.clientHeight||340;C3.r.setPixelRatio(Math.min(devicePixelRatio||1,2));C3.r.setSize(w,h,false);C3.cam.aspect=w/h;C3.cam.updateProjectionMatrix();
    C3.cam.position.set(0,5.6,12.5);C3.cam.lookAt(0,1.6,0);
    const st=STYLES.find(x=>x.k===S.style)||STYLES[0];C3.sc.background=new T.Color(st.sky);
    if(C3.grp){C3.sc.remove(C3.grp);C3.grp.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}
    C3.grp=buildCastle3D();C3.grp.rotation.y=C3.ang;C3.sc.add(C3.grp);
    if(!C3.raf){const loop=()=>{if(!C3.r.domElement.isConnected||tab!=='chateau'){C3.raf=0;return}C3.raf=requestAnimationFrame(loop);
      if(G.active)return;if(!C3.down)C3.ang+=.004;C3.grp.rotation.y=C3.ang;C3.grp.position.y=Math.sin(performance.now()/1400)*.12;C3.r.render(C3.sc,C3.cam)};C3.raf=requestAnimationFrame(loop)}
  }catch(e){host.innerHTML='<p class="empty" style="padding:20px">Aperçu 3D indisponible sur cet appareil.</p>'}
}

function drawIsles(c,t,sel,LST){LST=LST||(S.isles||[]).map(bi=>BOTS[bi]?{k:bi,sd:bi,theme:BOTS[bi].theme,cls:BOTS[bi].cls}:null);

const myTroph=()=>(ONL.me&&ONL.me.trophies!=null)?ONL.me.trophies:1000;
function oDiff(o){const hl=(o.hero&&o.hero.lvl)||S.hero.lvl,sc=(hl-S.hero.lvl)*.5+((o.lvl||1)-S.my.lvl)*.8+((o.trophies||1000)-myTroph())/250;return sc<-1.5?1:sc<2?2:3}
function oGain(o){const diff=clamp(((o.trophies||1000)-myTroph())/25,-10,10);return {w:Math.round(clamp(20+diff,5,35)),l:Math.round(clamp(12-diff*.5,4,18))}}
function oPick(force){const L=ONL.opps||[],O=S.online;if(!O)return;const want=Math.min(5,L.length);let cur=force?[]:(O.isles||[]).filter(id=>L.some(o=>o.id===id));
  if(!force&&cur.length>=want){O.isles=cur;return}
  const old=force?(O.isles||[]):[],avoid=L.length-old.length>=5?old:[],pool=L.filter(o=>!cur.includes(o.id)&&!avoid.includes(o.id)).map(o=>({o,d:Math.abs((o.trophies||1000)-myTroph())+Math.random()*120})).sort((a,b)=>a.d-b.d).map(x=>x.o);
  const out=cur.slice();for(const w of[1,2,3]){if(out.length>=want)break;const k=pool.findIndex(o=>oDiff(o)===w);if(k>=0)out.push(pool.splice(k,1)[0].id)}
  while(out.length<want&&pool.length)out.push(pool.splice(Math.floor(Math.random()*Math.min(6,pool.length)),1)[0].id);
  O.isles=out.sort(()=>Math.random()-.5);if(!O.isles.includes(O.isleSel))O.isleSel=null;save()}

function cellOf(x,y){const i=clamp(Math.floor(x/NAV.c),0,NAV.cols-1),j=clamp(Math.floor(y/NAV.c),0,NAV.rows-1);return j*NAV.cols+i}
function nearFree(c){if(NAV.free[c])return c;const ci=c%NAV.cols,cj=(c/NAV.cols)|0;for(let r=1;r<8;r++)for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){const i=ci+di,j=cj+dj;if(i<0||j<0||i>=NAV.cols||j>=NAV.rows)continue;const k=j*NAV.cols+i;if(NAV.free[k])return k}return c}
function fieldFrom(x,y){const t=nearFree(cellOf(x,y));let f=NAV.cache.get(t);if(f)return f;if(NAV.cache.size>160)NAV.cache.clear();
  const n=NAV.cols*NAV.rows;f=new Int16Array(n).fill(-1);f[t]=0;const q=[t];let h=0;
  while(h<q.length){const c=q[h++],ci=c%NAV.cols,cj=(c/NAV.cols)|0;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const i=ci+di,j=cj+dj;if(i<0||j<0||i>=NAV.cols||j>=NAV.rows)continue;const k=j*NAV.cols+i;if(!NAV.free[k]||f[k]>=0)continue;
      if(di&&dj&&(!NAV.free[cj*NAV.cols+i]||!NAV.free[j*NAV.cols+ci]))continue;f[k]=f[c]+1;q.push(k)}}
  NAV.cache.set(t,f);return f}
function clearPath(o,tx,ty){const R0=o.r||14,dx=tx-o.x,dy=ty-o.y,L2=dx*dx+dy*dy||1;
  for(const p of G.pillars.concat(G.props?G.props.filter(q=>!q.dead):[])){if(Math.hypot(p.x-tx,p.y-ty)<p.r+R0+8)continue;const t=clamp(((p.x-o.x)*dx+(p.y-o.y)*dy)/L2,0,1),cx=o.x+dx*t-p.x,cy=o.y+dy*t-p.y;if(Math.hypot(cx,cy)<p.r+R0-1)return false}return true}
function navDir(o,tx,ty){const dx=tx-o.x,dy=ty-o.y,l=Math.hypot(dx,dy)||1;if((!G.walls.length||los(o,{x:tx,y:ty},(o.r||14)*.8))&&clearPath(o,tx,ty))return [dx/l,dy/l];
  const f=fieldFrom(tx,ty),c=nearFree(cellOf(o.x,o.y)),ci=c%NAV.cols,cj=(c/NAV.cols)|0;let best=-1,bv=f[c]>=0?f[c]:1e9;
  for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const i=ci+di,j=cj+dj;if(i<0||j<0||i>=NAV.cols||j>=NAV.rows)continue;const k=j*NAV.cols+i;if(f[k]>=0&&f[k]<bv){bv=f[k];best=k}}
  if(best<0){if(f[c]>=0&&(cellOf(o.x,o.y)!==c)){best=c}else return [dx/l,dy/l]}
  const bx=(best%NAV.cols+.5)*NAV.c,by=((best/NAV.cols|0)+.5)*NAV.c,ex=bx-o.x,ey=by-o.y,el=Math.hypot(ex,ey)||1;return [ex/el,ey/el]}
function pathOpen(){buildNav();const f=fieldFrom(G.door.x,G.door.y);return f[nearFree(cellOf(G.start.x,G.start.y))]>=0}
function keepPathOpen(){let g=0;while(!pathOpen()&&G.props.length&&g++<30){let worst=0,bd=-1;G.props.forEach((p,i)=>{const d=Math.min(...G.walls.map(w=>Math.hypot(p.x-clamp(p.x,w.x0,w.x1),p.y-clamp(p.y,w.y0,w.y1))),999);const sc=(p.k==='coffret'?0:1)*1000-d;if(sc>bd){bd=sc;worst=i}});G.props.splice(worst,1)}}
function freePoint(x,y){if(!blockedAt(x,y,14))return {x,y};const c=nearFree(cellOf(x,y));return {x:(c%NAV.cols+.5)*NAV.c,y:((c/NAV.cols|0)+.5)*NAV.c}}

function endRaid(success,abandon){if(document.pointerLockElement)try{document.exitPointerLock()}catch(e){}if(G.ending)return;G.ending=true;G.over=true;ptr.down=false;JOY.on=false;JOY.id=null;{const j=$('#joy');if(j)j.hidden=true}setTimeout(()=>showResults(success,abandon),abandon?200:success?1500:1300)}

/* ===== Salle d'entraînement : mannequins invincibles, aucune pénalité ===== */
function trHud(){const T=G.tr||{tot:0,log:[],max:0,t0:0},now=G.time;if(T.cache&&now-T.cacheT<.25)return T.cache;T.log=T.log.filter(x=>now-x[0]<=5);
  const act=T.t0&&now-(T.last||-99)<=4,dur=act?Math.max(.5,now-T.t0):0,d5=T.log.reduce((a,x)=>a+x[1],0)/Math.max(1,Math.min(5,dur||5)),avg=dur?T.tot/dur:0;
  T.cacheT=now;T.cache=`<li class="ok">🎯 Salle d'entraînement</li><li>⚡ DPS (5 s) : <b>${fmt(Math.round(act?d5:0))}</b></li><li>📈 DPS moyen : ${fmt(Math.round(avg))}</li><li>💥 Plus gros coup : ${fmt(Math.round(T.max||0))}</li><li>Σ ${fmt(Math.round(T.tot||0))} dégâts en ${fmtTime(dur)}</li><li style="opacity:.75">Arrête de frapper 4 s pour remettre à zéro · ⚑ pour sortir</li>`;return T.cache}
function startTraining(){if(!window.THREE){toast('Le moteur 3D ne s\'est pas chargé.');return}
  G.trSave={pots:JSON.parse(JSON.stringify(S.pots||{})),gold:S.hero.gold};
  startRaid({id:'training',name:"Salle d'entraînement",lvl:Math.max(1,S.hero.lvl),theme:0,rooms:[{mobs:['mannequin','mannequin','mannequin','mannequin'],traps:[],lay:'ouverte'}],mine:true,training:true});
  G.tr={tot:0,log:[],max:0,t0:0};const h=G.hero,ds=G.enemies.filter(e=>e.kind==='mannequin');
  ds.forEach((e,i)=>{e.dummy=1;e.x=clamp(h.x+230+(i%2)*150,G.B.l+60,G.B.r-60);e.y=clamp(h.y+(i<2?-90:90),G.B.t+60,G.B.b-60);if(i===3){e.dummyF=.3;e.hp=e.maxHp*.3;e.dname='Mannequin blessé (30 % PV)'}});
  G.props=G.props.filter(p=>p.k!=='coffret');G.banner={txt:"Salle d'entraînement",sub:'Mannequins invincibles · le dernier reste à 30 % de PV (pour tester les exécutions)',t:3}}
function showResults(success,abandon){
  G.active=false;const c=G.castle;if(c&&c.training){const T=G.tr||{};if(G.trSave){S.pots=G.trSave.pots;S.hero.gold=Math.max(S.hero.gold,G.trSave.gold)}G.trSave=null;$('#raid').hidden=true;$('#modal').hidden=true;save();renderHub();toast(T.tot?`🎯 Entraînement : ${fmt(Math.round(T.tot))} dégâts, plus gros coup ${fmt(Math.round(T.max||0))}`:'🎯 Sortie de la salle d\'entraînement');return}let gold=0,xp=Math.round(G.xpGot*(1+.06*tr('fortune'))),items=[],notes=[],title,sub;const fail=!success;
  if(c.mine){xp=0;
    if(success){const was=S.my.validated;S.my.validated=true;if(!was)pushJournal({info:true,win:true,text:"Ton château a été testé et validé. Les pillards peuvent maintenant l'attaquer."});title='Château validé !';sub="Ton château est ouvert aux pillards. Des raids aléatoires viendront le mettre à l'épreuve."}
    else{title='Test échoué';sub="Ton château reste fermé aux pillards tant que tu ne l'as pas terminé toi-même. Allège-le ou équipe-toi mieux."}}
  else{gold=G.goldGot;items=G.itemsGot.slice();
    if(success){for(const co of G.coins)gold+=co.v;for(const b of G.bags)items.push(b.it);
      const target=c.rooms.length*55;if(G.time<target){const bonus=Math.round(gold*.25);gold+=bonus;notes.push(['good',`Pillage éclair (moins de ${fmtTime(target)}) : +${bonus} or`])}
      if(!S.best[c.id]||G.time<S.best[c.id]){if(S.best[c.id])notes.push(['good','Nouveau record de temps !']);S.best[c.id]=Math.round(G.time)}
      S.cleared[c.id]=true;{const cl=heroCl(),i=RIVALS.findIndex(r=>r.id===c.id);if(i>=0&&!cl[c.id]){cl[c.id]=1;const nx=RIVALS[i+1];if(nx)notes.push(['good',`🔓 Nouveau château débloqué : ${nx.name} (niv. ${nx.lvl})`])}}title='Château pillé !';sub=`Tu as vidé le coffre de ${c.name}.`}
    else{gold=gold*.5;title=abandon?'Raid abandonné':'Ton héros est tombé';sub="Tu gardes la moitié de l'or ramassé, l'expérience et les sacs déjà récupérés. Le coffre, lui, reste fermé."}}
  if(fail&&!abandon&&!c.mine&&S.hero.cls!=='recrue'){S.ko=S.ko||{};S.ko[S.hero.cls]=NOW()+KO_MS;notes.push(['bad',`Ton ${CL().name} est blessé : il se repose 10 minutes. Joue un autre héros ou la Recrue en attendant.`])}
  {const tx=[];for(const l in G.seedsGot){const n=Math.round(G.seedsGot[l]*(fail?.5:1));if(n){S.seeds[l]=(S.seeds[l]||0)+n;tx.push(n+' × niv. '+l)}}if(tx.length)notes.push(['good','Graines trouvées : '+tx.join(', ')+". Plante-les dans l'Alchimie."])}if(c.arena)arenaResult(success,notes);if(c.online)onlineRaidEnd(c,success,notes);setTimeout(()=>cloudSave(false),1500);if(!c.mine){const rc=success?c.rooms.length:Math.max(0,G.roomIdx),bpp=bpAdd(rc*10+(success?30:0)+(success&&c.arena?15:0)+(G.kills||0));if(bpp)notes.push(['good',`🎟 Passe de combat : +${bpp} points`])}if(!c.mine){qProg('kills',G.kills);cnt('kills',G.kills);if(G.pal&&success)cnt('palRaids');if(success&&!c.arena){qProg('raids',1);S.stats.raids++}if(success&&c.arena)qProg('arena',1)}gold=Math.round(gold*(1+.06*tr('fortune'))*(S.pals.active==='boulet'?1.06:1));S.hero.gold+=gold;const ups=xp?addXp(xp):0;
  if(G.garbUsed){G.garbUsed=0;const g=garbS();if(!g.gone){g.gone=1;g.own=0;notes.push(['bad',"🫙 Mère Sauge retire l'Eau de Garbourg de la vente : « Bon… la recette n'était pas si bonne que ça. » La fiole disparaît de ton stock."])}}
  {const acc={n:0,g:0,f:0,fg:0};for(const it of items)bagAdd(it,acc);if(acc.n)notes.push(['',`Vente automatique : ${acc.n} objet(s) vendu(s) pour ${fmt(acc.g)} or.`]);if(acc.f)notes.push(['',`Sac plein : ${acc.f} objet(s) vendu(s) pour ${fmt(acc.fg)} or.`])}
  if(S.hero.bag.length>bagMax()){S.hero.bag.sort((a,b)=>b.value-a.value);const extra=S.hero.bag.splice(bagMax());let sold=0;for(const it of extra)sold+=it.value;S.hero.gold+=sold;notes.push(['',`Sac plein : ${extra.length} objet(s) vendu(s) automatiquement pour ${sold} or.`])}
  if(ups){notes.push(['good',`Niveau ${S.hero.lvl} atteint ! Attaque, défense et PV augmentent. +${ups} point(s) de talent.`]);setTimeout(sfx.level,200)}
  let def=null;if(!c.mine){def=Math.random()<.5?simulateDefense():null;if(def)pushJournal(def);else if(!S.my.validated)notes.push(['',"Ton château n'est pas validé : teste-le dans « Mon château » pour gagner de l'or quand les pillards échouent."])}
  save();
  const itemsHTML=items.length?`<div><h3 style="margin-bottom:6px">Butin</h3><ul class="rlist">${items.map(it=>`<li style="color:${RCOL[it.r]}">${esc(it.name)}<span>${rarLabel(it)} · ${SLOT_LABEL[it.slot]} · niv. ${it.lvl}</span></li>`).join('')}</ul></div>`:'';
  const defHTML=def?`<p class="rnote ${def.win?'good':'bad'}"><b>Pendant ton absence :</b> ${esc(def.text)} ${def.win?`+${def.gold}`:def.gold} or.</p>`:'';
  const mb=$('#mbox');mb.className='mbox frame'+(fail?' fail':'');
  mb.innerHTML=`<h2>${title}</h2><p class="sub" style="margin:0">${sub}</p>
    ${c.mine?'':`<dl class="rstats"><div><dt>Or</dt><dd>+${fmt(gold)}</dd></div><div><dt>Expérience</dt><dd>+${fmt(xp)}</dd></div><div><dt>Temps</dt><dd>${fmtTime(G.time)}</dd></div></dl>`}
    ${itemsHTML}${G.matGot&&(G.matGot.rune||G.matGot.heart)?`<p class="rnote" style="color:#8fd0ff">Composants : ${G.matGot.rune?`🔷 ${G.matGot.rune} fragment${G.matGot.rune>1?'s':''} runique${G.matGot.rune>1?'s':''}`:''}${G.matGot.heart?` · 🌟 ${G.matGot.heart} cœur légendaire`:''}</p>`:''}${G.frags&&G.frags.length?`<p class="rnote" style="color:#ff6a8e">✦ ${G.frags.length} fragment${G.frags.length>1?'s':''} mythique${G.frags.length>1?'s':''} : ${G.frags.map(k=>MYTH[k].ic+' '+MYTH[k].n).join(', ')}. Va voir l'Artisan légendaire au Marché.</p>`:''}${notes.map(n=>`<p class="rnote ${n[0]}">${n[1]}</p>`).join('')}${defHTML}
    <div class="actions">${!c.mine?(c.arena?'<button class="btn" data-act="match">Nouveau match</button>':`<button class="btn" data-act="raid" data-id="${c.id}">Rejouer</button>`):(!success?'<button class="btn" data-act="test">Réessayer</button>':'')}<button class="btn primary" data-act="closeModal">Retour au camp</button></div>`;
  $('#modal').hidden=false;mb.querySelector('.btn.primary').focus();renderTop();
}

/* ================= Démarrage ================= */
/* --- application Android : retour, mise en pause --- */
window.__androidPause=()=>{try{save()}catch(e){}};
window.__androidBack=()=>{try{if(G.active&&G.edit){closeEditor();return 1}if(G.active&&!G.over){toast('Pour quitter le raid, utilise le drapeau ⚑');return 1}
  if(!$('#modal').hidden){if(!S.hero.created)return 1;$('#modal').hidden=true;$('#raid').hidden=true;renderHub();return 1}if(tab!=='pillage'){tab='pillage';renderHub();return 1}}catch(e){}return 0};
function migrateMage(h,cls){if(!h||cls!=='mage'||h.mageOwn)return;const own={};if(S.mageEl==='glace')own.glace=true;if(S.mageNova&&S.mageNova!=='explo')own[S.mageNova]=true;h.mageOwn=own}
function migrateSubs(h){if(!h)return;const own=Object.assign({},h.subOwn);if(h.sub)own[h.sub]=true;for(const k in (h.subData||{}))if(k)own[k]=true;h.subOwn=own}
try{kkLoad()}catch(e){}
load();CLK.off=+S.clkOff||0;try{migratePots()}catch(e){}try{migrateHp()}catch(e){}try{migrateUniq()}catch(e){}try{migrateSubs(S.hero);for(const k in (S.roster||{}))migrateSubs(S.roster[k]);migrateMage(S.hero.cls==='mage'?S.hero:(S.roster||{}).mage,'mage');if(!mageOwned(S.mageNova||'explo')&&S.hero.cls==='mage')S.mageNova='explo';if(S.mageEl==='glace'&&S.hero.cls==='mage'&&!mageOwned('glace'))S.mageEl='feu'}catch(e){}if(!S.nextRaid||S.nextRaid<NOW())S.nextRaid=NOW()+randi(30,90)*1000;renderHub();if(!S.hero.created)openCreate(false);if(S.hero.created&&S.seenPatch!==PATCH_V){const d=$('#setBtn');if(d)d.classList.add('newdot');setTimeout(()=>{if(!G.active)toast('📜 Mise à jour '+PATCH_V+' : découvre les nouveautés dans Réglages → Patch notes')},2500)}
})();
</script>
